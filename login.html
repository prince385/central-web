<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Login</title>
	<link rel="stylesheet" href="/css/login.css">
</head>
<body>
	<div class="box">
		<form autocomplete="off">
			<h2>Sign In</h2>
			<div class="inputBox">
				<input type="text" required="required" onblur="blurFocus(0)" onfocus="onFocus(0)">
				<span>Userame</span>
				<i></i>
			</div>
			<div class="inputBox">
				<input type="password" required="required" onblur="blurFocus(1)" onfocus="onFocus(1)">
				<span>Password</span>
				<i></i>
			</div>
			<div class="links">
				<a href="#">Forgot Password ?</a>
				<a href="./signup.html">Sign Up</a>
			</div>
			<input type="submit" value="Login">
		</form>
	</div>
    <script src="./login.js"></script>
</body>
</html>
